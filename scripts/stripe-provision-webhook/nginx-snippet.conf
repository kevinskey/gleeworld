# Append this server block to /etc/nginx/sites-available/api.gleeworld.org
# (and symlink into sites-enabled, then certbot --nginx -d api.gleeworld.org).
#
# Once DNS for api.gleeworld.org points at the droplet, this route gives
# Stripe a public URL to hit: https://api.gleeworld.org/stripe-webhook

server {
    listen 80;
    server_name api.gleeworld.org;

    location = /stripe-webhook {
        proxy_pass http://127.0.0.1:3030/stripe-webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stripe expects an answer within 5 seconds. Don't buffer.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 10;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3030/healthz;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
