<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- YouTube embed wrapper for the native apps.

     The Capacitor WKWebView's origin (capacitor://localhost) sends no valid
     HTTP Referer, so YouTube rejects direct embeds with error 153
     ("embedder identity: missing referrer"). The app iframes THIS page —
     served over https on every GleeWorld host — and the inner YouTube
     iframe then carries a referer YouTube accepts. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  var p = new URLSearchParams(location.search);
  var v = p.get('v') || '';
  var autoplay = p.get('autoplay') === '0' ? 0 : 1;
  // Only a plausible YouTube video id may reach the src attribute.
  if (/^[A-Za-z0-9_-]{6,20}$/.test(v)) {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v)
      + '?autoplay=' + autoplay + '&rel=0&playsinline=1';
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    document.body.appendChild(f);
  } else {
    document.body.textContent = 'Invalid video.';
  }
</script>
</body>
</html>
