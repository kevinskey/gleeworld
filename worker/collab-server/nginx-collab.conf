# nginx vhost for the Documents collaboration server.
# Install to /etc/nginx/sites-available/collab.gleeworld.org and symlink into
# sites-enabled. Run certbot AFTER the DNS A record resolves.
server {
    server_name collab.gleeworld.org;

    location / {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;

        # The WebSocket upgrade. Without these three the handshake 400s and
        # the editor silently falls back to no collaboration.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A collaborative socket is idle whenever nobody is typing. nginx's
        # 60s default would close it mid-session and the client would
        # reconnect every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
}

server {
    if ($host = collab.gleeworld.org) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name collab.gleeworld.org;
    return 404;
}
